<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAK</title>
    <style>
        :root {
            --bg: #F5F5F7;
            --surface: #FFFFFF;
            --surface-secondary: #F2F2F7;
            --border: rgba(0, 0, 0, 0.08);
            --text: #1D1D1F;
            --text-secondary: #86868B;
            --blue: #007AFF;
            --green: #34C759;
            --red: #FF3B30;
            --indigo: #5856D6;
            --orange: #FF9500;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* HEADER APPLE STYLE */
        header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .logo {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text);
        }
        .segmented-control {
            display: flex;
            background: #E5E5EA;
            padding: 3px;
            border-radius: 10px;
            gap: 2px;
        }
        .seg-btn {
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .seg-btn.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 14px 16px 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* VISTA CALIBRAR */
        #viewCalibrar { display: flex; flex-direction: column; gap: 12px; }
        .camera-card {
            position: relative;
            width: 100%;
            height: 46vh;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        video { width: 100%; height: 100%; object-fit: fill; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }

        .camera-pills {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 15;
            pointer-events: none;
        }
        .pill {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text);
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .pill.laser-detected {
            background: var(--red);
            color: #fff;
        }

        .lens-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 4px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 16;
        }
        .btn-zoom {
            background: transparent;
            color: var(--text);
            border: none;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-zoom.active {
            background: var(--text);
            color: #fff;
        }

        /* TARJETAS Y BOTONES APPLE */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .status-line {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.84rem;
            color: var(--text);
            font-weight: 500;
        }
        .step-badge {
            background: var(--surface-secondary);
            color: var(--blue);
            font-weight: 700;
            font-size: 0.72rem;
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 13px 12px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            transition: transform 0.12s ease, opacity 0.12s ease;
        }
        .btn:active { transform: scale(0.97); opacity: 0.85; }
        .btn:disabled { opacity: 0.55; cursor: default; }
        .btn-full { grid-column: span 2; }
        .btn-blue { background: var(--blue); color: #fff; border-color: var(--blue); }
        .btn-indigo { background: var(--indigo); color: #fff; border-color: var(--indigo); }
        .btn-green { background: var(--green); color: #fff; border-color: var(--green); }
        .btn-red { background: var(--surface); color: var(--red); border-color: rgba(255, 59, 48, 0.25); }
        .btn-red.on { background: var(--red); color: #fff; border-color: var(--red); }

        #identifyCard {
            display: none;
            background: var(--surface);
            border: 1px solid rgba(88, 86, 214, 0.25);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .id-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .id-title { font-size: 0.96rem; font-weight: 700; color: var(--indigo); }
        .id-model { font-size: 0.68rem; color: var(--text-secondary); font-weight: 600; }
        .id-desc { font-size: 0.82rem; color: var(--text); line-height: 1.4; }
        .other-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .obj-chip {
            background: var(--surface-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 11px;
            border-radius: 16px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* VISTA ÁREA SEGURA */
        #viewControl { display: none; flex-direction: column; gap: 12px; }
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }
        .metric-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 6px;
            box-shadow: var(--shadow);
        }
        .metric-box span { display: block; font-size: 0.66rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
        .metric-box b { font-size: 1rem; color: var(--text); font-weight: 700; }

        .touchpad-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 45vh;
            background: var(--surface);
            border: 2px solid var(--green);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            touch-action: none;
            cursor: crosshair;
            margin: 0 auto;
        }
        .grid-lines {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 25% 25%;
            pointer-events: none;
        }
        .crosshair-center {
            position: absolute;
            left: 50%; top: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            pointer-events: none;
        }
        .corner-tag {
            position: absolute;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 6px 8px;
            pointer-events: none;
        }
        .tag-tl { top: 0; left: 0; }
        .tag-tr { top: 0; right: 0; }
        .tag-bl { bottom: 0; left: 0; }
        .tag-br { bottom: 0; right: 0; }

        #laserCursor {
            position: absolute;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--red);
            border: 3px solid #fff;
            box-shadow: 0 2px 10px rgba(255, 59, 48, 0.55);
            transform: translate(-50%, -50%);
            left: 50%; top: 50%;
            pointer-events: none;
            transition: left 0.04s linear, top 0.04s linear;
        }

        .esp-link {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .esp-link a { color: var(--blue); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="logo">TRAK</div>
        <div class="segmented-control">
            <button class="seg-btn active" id="tabCalibrar" onclick="cambiarVista('calibrar')">Calibrar</button>
            <button class="seg-btn" id="tabControl" onclick="cambiarVista('control')">Area Segura</button>
        </div>
    </header>

    <main>
        <!-- VISTA 1: CALIBRACIÓN E IDENTIFICACIÓN -->
        <div id="viewCalibrar">
            <div class="camera-card">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlayCanvas"></canvas>

                <div class="camera-pills">
                    <div class="pill" id="laserStatusPill">Buscando laser</div>
                    <div class="pill" id="cornerCountPill">Esquinas: 0 / 2</div>
                </div>

                <div class="lens-bar">
                    <button class="btn-zoom" id="btnZoom05" onclick="setZoomMode(0.5)">0.5x</button>
                    <button class="btn-zoom active" id="btnZoom1" onclick="setZoomMode(1.0)">1x</button>
                    <button class="btn-zoom" onclick="siguienteCamara()">Lente</button>
                </div>
            </div>

            <div class="card">
                <div class="status-line">
                    <span class="step-badge" id="stepBadge">Paso 1</span>
                    <span id="instructionText">Toca 2 esquinas opuestas para marcar el Area Segura.</span>
                </div>
            </div>

            <div class="action-grid">
                <button class="btn btn-indigo btn-full" id="btnIdentify" onclick="identificarYSenalar()">Identificar y Señalar con Laser</button>
                <button class="btn btn-blue" id="btnAutoCalibrar" onclick="autoCalibrar()">Auto-Calibrar</button>
                <button class="btn" onclick="centrarAreaSegura()">Centro</button>
                <button class="btn btn-red on" id="btnLaserToggle" onclick="toggleLaser()">Laser: ON</button>
                <button class="btn" onclick="limpiarEsquinas()">Reiniciar</button>
            </div>

            <div id="identifyCard">
                <div class="id-header">
                    <span class="id-title" id="identifyTitle">Objeto Detectado</span>
                    <span class="id-model" id="identifyModel"></span>
                </div>
                <p class="id-desc" id="identifyDesc"></p>
                <div class="other-chips" id="otherChips"></div>
            </div>
        </div>

        <!-- VISTA 2: CONTROL DEL ÁREA SEGURA -->
        <div id="viewControl">
            <div class="metrics-row">
                <div class="metric-box"><span>Posicion</span><b id="ctrlXY">50%, 50%</b></div>
                <div class="metric-box"><span>Cabeceo</span><b id="ctrlC">--°</b></div>
                <div class="metric-box"><span>Rotacion</span><b id="ctrlR">--°</b></div>
            </div>

            <div class="touchpad-wrapper" id="safePad">
                <div class="grid-lines"></div>
                <div class="crosshair-center"></div>
                <span class="corner-tag tag-tl" id="padTL">TL</span>
                <span class="corner-tag tag-tr" id="padTR">TR</span>
                <span class="corner-tag tag-bl" id="padBL">BL</span>
                <span class="corner-tag tag-br" id="padBR">BR</span>
                <div id="laserCursor"></div>
            </div>

            <div class="action-grid">
                <button class="btn btn-blue" onclick="centrarAreaSegura()">Centro</button>
                <button class="btn btn-red on" id="btnLaserCtrl" onclick="toggleLaser()">Laser: ON</button>
                <button class="btn btn-green btn-full" id="btnPatrulla" onclick="togglePatrulla()">Patrullar Perimetro</button>
            </div>

            <div class="esp-link">
                Web local del dispositivo: <a href="http://192.168.68.107" target="_blank">192.168.68.107</a>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');

        let esquinas = [];
        let laserPos = { x: 0.5, y: 0.5, detected: false };
        let cabeceoActual = 115;
        let rotacionActual = 124;
        let calibrando = false;
        let detectedObject = null;
        let jacobianMatrix = JSON.parse(localStorage.getItem('trak_jacobian') || 'null');

        let videoDevices = [];
        let currentDeviceIndex = 0;
        let currentTrack = null;

        function cambiarVista(vista) {
            document.getElementById('viewCalibrar').style.display = vista === 'calibrar' ? 'flex' : 'none';
            document.getElementById('viewControl').style.display = vista === 'control' ? 'flex' : 'none';
            document.getElementById('tabCalibrar').classList.toggle('active', vista === 'calibrar');
            document.getElementById('tabControl').classList.toggle('active', vista === 'control');
            if (vista === 'control') cargarEstadoESP32();
            else setTimeout(ajustarCanvas, 50);
        }

        async function initCamera() {
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                tempStream.getTracks().forEach(t => t.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(d => d.kind === 'videoinput');
                const rearDevices = videoDevices.filter(d =>
                    d.label.toLowerCase().includes('back') ||
                    d.label.toLowerCase().includes('rear') ||
                    d.label.toLowerCase().includes('environment')
                );
                if (rearDevices.length > 0) videoDevices = rearDevices;

                await startCameraStream(0);
                video.onloadedmetadata = () => {
                    ajustarCanvas();
                    requestAnimationFrame(renderLoop);
                    setInterval(detectarLaserFrame, 150);
                };
            } catch (err) {
                console.error("Error camara:", err);
            }
        }

        async function startCameraStream(deviceIndex) {
            if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            const constraints = { video: { width: { ideal: 1920 }, height: { ideal: 1080 } } };
            if (videoDevices.length > 0 && videoDevices[deviceIndex]) {
                constraints.video.deviceId = { exact: videoDevices[deviceIndex].deviceId };
            } else {
                constraints.video.facingMode = { ideal: "environment" };
            }
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            currentTrack = stream.getVideoTracks()[0];
            ajustarCanvas();
        }

        async function setZoomMode(factor) {
            document.getElementById('btnZoom05').classList.toggle('active', factor === 0.5);
            document.getElementById('btnZoom1').classList.toggle('active', factor === 1.0);
            if (!currentTrack) return;
            const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
            if (caps.zoom) {
                try {
                    await currentTrack.applyConstraints({ advanced: [{ zoom: factor === 0.5 ? caps.zoom.min : 1.0 }] });
                    return;
                } catch (e) {}
            }
            if (factor === 0.5 && videoDevices.length > 1) {
                let idx = videoDevices.findIndex(d =>
                    d.label.toLowerCase().includes('ultra') || d.label.toLowerCase().includes('wide') || d.label.toLowerCase().includes('0.5')
                );
                if (idx === -1) idx = (currentDeviceIndex + 1) % videoDevices.length;
                if (idx !== currentDeviceIndex) {
                    currentDeviceIndex = idx;
                    await startCameraStream(idx);
                }
            } else if (factor === 1.0 && videoDevices.length > 0) {
                currentDeviceIndex = 0;
                await startCameraStream(0);
            }
        }

        async function siguienteCamara() {
            if (videoDevices.length <= 1) return;
            currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            await startCameraStream(currentDeviceIndex);
        }

        function ajustarCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', ajustarCanvas);

        canvas.addEventListener('click', (e) => {
            if (calibrando) return;
            if (esquinas.length >= 2) esquinas = [];
            const rect = canvas.getBoundingClientRect();
            esquinas.push({
                x: (e.clientX - rect.left) / rect.width,
                y: (e.clientY - rect.top) / rect.height
            });
            actualizarUIEsquinas();
        });

        function actualizarUIEsquinas() {
            document.getElementById('cornerCountPill').innerText = `Esquinas: ${esquinas.length} / 2`;
            if (esquinas.length === 0) {
                document.getElementById('stepBadge').innerText = "Paso 1";
                document.getElementById('instructionText').innerText = "Toca 2 esquinas opuestas para marcar el Area Segura.";
            } else if (esquinas.length === 1) {
                document.getElementById('stepBadge').innerText = "Paso 2";
                document.getElementById('instructionText').innerText = "Toca la esquina opuesta para cerrar el rectangulo.";
            } else {
                document.getElementById('stepBadge').innerText = "Listo";
                document.getElementById('instructionText').innerText = "Area marcada. Pulsa Auto-Calibrar para alinear.";
            }
        }

        function limpiarEsquinas() {
            esquinas = [];
            detectedObject = null;
            document.getElementById('identifyCard').style.display = 'none';
            actualizarUIEsquinas();
        }

        function obtenerRectanguloDe2Esquinas() {
            if (esquinas.length < 2) return null;
            const xMin = Math.min(esquinas[0].x, esquinas[1].x);
            const xMax = Math.max(esquinas[0].x, esquinas[1].x);
            const yMin = Math.min(esquinas[0].y, esquinas[1].y);
            const yMax = Math.max(esquinas[0].y, esquinas[1].y);
            return {
                TL: { x: xMin, y: yMin },
                TR: { x: xMax, y: yMin },
                BR: { x: xMax, y: yMax },
                BL: { x: xMin, y: yMax },
                center: { x: (xMin + xMax) / 2, y: (yMin + yMax) / 2 }
            };
        }

        function capturarFrameBase64(width = 480) {
            const snap = document.createElement('canvas');
            snap.width = width;
            snap.height = Math.round(width * (canvas.clientHeight / canvas.clientWidth));
            const sCtx = snap.getContext('2d');
            sCtx.drawImage(video, 0, 0, snap.width, snap.height);
            return snap.toDataURL('image/jpeg', 0.78);
        }

        async function detectarLaserFrame() {
            if (video.videoWidth === 0 || video.clientWidth === 0 || calibrando) return;
            try {
                const res = await fetch('/api/detect_laser', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_base64: capturarFrameBase64(480) })
                });
                const data = await res.json();
                laserPos.detected = data.detected;
                const p = document.getElementById('laserStatusPill');
                if (data.detected) {
                    laserPos.x = data.x;
                    laserPos.y = data.y;
                    p.innerText = `Laser: ${Math.round(data.x*100)}%, ${Math.round(data.y*100)}%`;
                    p.classList.add('laser-detected');
                } else {
                    p.innerText = 'Buscando laser';
                    p.classList.remove('laser-detected');
                }
            } catch (err) {}
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const rectArea = obtenerRectanguloDe2Esquinas();
            if (rectArea) {
                const x1 = rectArea.TL.x * canvas.width;
                const y1 = rectArea.TL.y * canvas.height;
                const w = (rectArea.TR.x - rectArea.TL.x) * canvas.width;
                const h = (rectArea.BL.y - rectArea.TL.y) * canvas.height;

                ctx.fillStyle = "rgba(52, 199, 89, 0.18)";
                ctx.fillRect(x1, y1, w, h);
                ctx.strokeStyle = "#34C759";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(x1, y1, w, h);
            }

            esquinas.forEach((pt, idx) => {
                const px = pt.x * canvas.width;
                const py = pt.y * canvas.height;
                ctx.beginPath();
                ctx.arc(px, py, 8, 0, 2 * Math.PI);
                ctx.fillStyle = "#34C759";
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            if (laserPos.detected) {
                const lx = laserPos.x * canvas.width;
                const ly = laserPos.y * canvas.height;
                ctx.beginPath();
                ctx.arc(lx, ly, 15, 0, 2 * Math.PI);
                ctx.strokeStyle = "#FF3B30";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(lx - 8, ly); ctx.lineTo(lx + 8, ly);
                ctx.moveTo(lx, ly - 8); ctx.lineTo(lx, ly + 8);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            if (detectedObject) {
                const [ymin, xmin, ymax, xmax] = detectedObject.box || [0.4, 0.4, 0.6, 0.6];
                const bx = xmin * canvas.width;
                const by = ymin * canvas.height;
                const bw = (xmax - xmin) * canvas.width;
                const bh = (ymax - ymin) * canvas.height;

                ctx.strokeStyle = "#5856D6";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(bx, by, bw, bh);

                const tx = detectedObject.target_x * canvas.width;
                const ty = detectedObject.target_y * canvas.height;
                ctx.beginPath();
                ctx.arc(tx, ty, 6, 0, 2 * Math.PI);
                ctx.fillStyle = "#5856D6";
                ctx.fill();

                ctx.font = "600 12px -apple-system, sans-serif";
                const textW = ctx.measureText(detectedObject.objeto).width + 16;
                ctx.fillStyle = "#5856D6";
                ctx.fillRect(bx, Math.max(0, by - 24), Math.min(240, textW), 24);
                ctx.fillStyle = "#fff";
                ctx.fillText(detectedObject.objeto, bx + 8, Math.max(16, by - 8));
            }

            requestAnimationFrame(renderLoop);
        }

        async function medirPosicionLaser() {
            const res = await fetch('/api/detect_laser', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image_base64: capturarFrameBase64(480) })
            });
            return await res.json();
        }

        async function moverServos(cab, rot) {
            cabeceoActual = cab;
            rotacionActual = rot;
            await fetch('/api/esp32/servo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cabeceo: cab, rotacion: rot })
            });
            await new Promise(r => setTimeout(r, 380));
        }

        async function autoCalibrar() {
            const rectArea = obtenerRectanguloDe2Esquinas();
            if (!rectArea) {
                alert("Toca 2 esquinas opuestas en la camara primero.");
                return;
            }

            calibrando = true;
            document.getElementById('stepBadge').innerText = "Fase 1";
            document.getElementById('instructionText').innerText = "Mapeando sensibilidad de ejes...";

            await moverServos(110, 120);
            const p0 = await medirPosicionLaser();
            if (!p0.detected) {
                calibrando = false;
                alert("No se detecta el laser. Verifica que este encendido y visible.");
                actualizarUIEsquinas();
                return;
            }

            const dRot = 14, dCab = 14;
            await moverServos(110, 120 + dRot);
            const pRot = await medirPosicionLaser();
            await moverServos(110 + dCab, 120);
            const pCab = await medirPosicionLaser();

            jacobianMatrix = {
                dx_drot: (pRot.x - p0.x) / dRot,
                dy_drot: (pRot.y - p0.y) / dRot,
                dx_dcab: (pCab.x - p0.x) / dCab,
                dy_dcab: (pCab.y - p0.y) / dCab
            };
            localStorage.setItem('trak_jacobian', JSON.stringify(jacobianMatrix));
            await moverServos(110, 120);

            const targets = [
                { key: "TL", name: "Superior Izquierda", pt: rectArea.TL },
                { key: "TR", name: "Superior Derecha", pt: rectArea.TR },
                { key: "BR", name: "Inferior Derecha", pt: rectArea.BR },
                { key: "BL", name: "Inferior Izquierda", pt: rectArea.BL }
            ];
            const cal = {};

            for (let i = 0; i < targets.length; i++) {
                const t = targets[i];
                document.getElementById('stepBadge').innerText = `${i+1} / 4`;
                document.getElementById('instructionText').innerText = `Alineando: ${t.name}`;

                for (let step = 0; step < 8; step++) {
                    const res = await fetch('/api/align_step', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image_base64: capturarFrameBase64(480),
                            target_x: t.pt.x,
                            target_y: t.pt.y,
                            cabeceo_actual: cabeceoActual,
                            rotacion_actual: rotacionActual,
                            ...jacobianMatrix
                        })
                    });
                    const d = await res.json();
                    if (d.nuevo_cabeceo !== undefined) {
                        cabeceoActual = d.nuevo_cabeceo;
                        rotacionActual = d.nueva_rotacion;
                    }
                    if (d.alineado) break;
                    await new Promise(r => setTimeout(r, 380));
                }
                cal[`c${t.key}`] = cabeceoActual;
                cal[`r${t.key}`] = rotacionActual;
            }

            await fetch('/api/save_safe_area', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cal)
            });

            calibrando = false;
            document.getElementById('stepBadge').innerText = "Listo";
            document.getElementById('instructionText').innerText = "Area Segura calibrada y guardada.";
            cambiarVista('control');
        }

        async function apuntarAObjetivo(targetX, targetY, label) {
            calibrando = true;
            document.getElementById('stepBadge').innerText = "Apuntando";
            document.getElementById('instructionText').innerText = `Señalando: ${label}`;

            if (!jacobianMatrix) {
                const p0 = await medirPosicionLaser();
                if (p0.detected) {
                    const baseCab = cabeceoActual;
                    const baseRot = rotacionActual;
                    const dRot = baseRot > 150 ? -12 : 12;
                    const dCab = baseCab > 150 ? -12 : 12;
                    await moverServos(baseCab, baseRot + dRot);
                    const pRot = await medirPosicionLaser();
                    await moverServos(baseCab + dCab, baseRot);
                    const pCab = await medirPosicionLaser();
                    jacobianMatrix = {
                        dx_drot: (pRot.x - p0.x) / dRot,
                        dy_drot: (pRot.y - p0.y) / dRot,
                        dx_dcab: (pCab.x - p0.x) / dCab,
                        dy_dcab: (pCab.y - p0.y) / dCab
                    };
                    localStorage.setItem('trak_jacobian', JSON.stringify(jacobianMatrix));
                    await moverServos(baseCab, baseRot);
                }
            }

            const j = jacobianMatrix || { dx_dcab: 0, dx_drot: 0, dy_dcab: 0, dy_drot: 0 };
            for (let step = 0; step < 8; step++) {
                const res = await fetch('/api/align_step', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image_base64: capturarFrameBase64(480),
                        target_x: targetX,
                        target_y: targetY,
                        cabeceo_actual: cabeceoActual,
                        rotacion_actual: rotacionActual,
                        ...j
                    })
                });
                const d = await res.json();
                if (d.nuevo_cabeceo !== undefined) {
                    cabeceoActual = d.nuevo_cabeceo;
                    rotacionActual = d.nueva_rotacion;
                }
                if (d.alineado) break;
                await new Promise(r => setTimeout(r, 360));
            }

            calibrando = false;
            document.getElementById('stepBadge').innerText = "Señalado";
            document.getElementById('instructionText').innerText = `Laser apuntando a: ${label}`;
        }

        async function identificarYSenalar() {
            const btn = document.getElementById('btnIdentify');
            const card = document.getElementById('identifyCard');
            btn.disabled = true;
            btn.innerText = "Analizando escena...";
            document.getElementById('stepBadge').innerText = "IA";
            document.getElementById('instructionText').innerText = "Identificando objetos en vision...";

            try {
                const res = await fetch('/api/identify_and_point', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_base64: capturarFrameBase64(640) })
                });
                const d = await res.json();
                if (d.error) {
                    alert("Error IA: " + d.error);
                    actualizarUIEsquinas();
                    return;
                }

                detectedObject = {
                    objeto: d.objeto,
                    target_x: d.target_x,
                    target_y: d.target_y,
                    box: d.box
                };

                card.style.display = 'block';
                document.getElementById('identifyTitle').innerText = d.objeto;
                document.getElementById('identifyModel').innerText = d.model || "";
                document.getElementById('identifyDesc').innerText = d.descripcion || "";

                const chips = document.getElementById('otherChips');
                chips.innerHTML = "";
                if (d.otros && d.otros.length > 0) {
                    d.otros.forEach(o => {
                        const btnChip = document.createElement('button');
                        btnChip.className = 'obj-chip';
                        btnChip.innerText = o.nombre;
                        btnChip.onclick = () => {
                            detectedObject = { objeto: o.nombre, target_x: o.x, target_y: o.y, box: o.box };
                            document.getElementById('identifyTitle').innerText = o.nombre;
                            apuntarAObjetivo(o.x, o.y, o.nombre);
                        };
                        chips.appendChild(btnChip);
                    });
                }

                await apuntarAObjetivo(d.target_x, d.target_y, d.objeto);
            } catch (e) {
                alert("Error de conexion: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Identificar y Señalar con Laser";
            }
        }

        // CONTROL DEL CUADRADO DE ÁREA SEGURA
        const pad = document.getElementById('safePad');
        const cursor = document.getElementById('laserCursor');
        let draggingPad = false;
        let lastPadSend = 0;

        function enviarCoordenadaPad(u, v, force = false) {
            u = Math.max(0, Math.min(1, u));
            v = Math.max(0, Math.min(1, v));
            cursor.style.left = (u * 100) + '%';
            cursor.style.top = (v * 100) + '%';
            document.getElementById('ctrlXY').innerText = `${Math.round(u*100)}%, ${Math.round(v*100)}%`;

            const now = Date.now();
            if (!force && now - lastPadSend < 65) return;
            lastPadSend = now;

            fetch('/api/esp32/move_norm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ u, v })
            }).then(r => r.json()).then(actualizarEstadoCtrl).catch(() => {});
        }

        function manejarEventoPad(e, force = false) {
            const rect = pad.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            enviarCoordenadaPad((clientX - rect.left) / rect.width, (clientY - rect.top) / rect.height, force);
        }

        pad.addEventListener('pointerdown', (e) => { draggingPad = true; manejarEventoPad(e, true); });
        pad.addEventListener('pointermove', (e) => { if (draggingPad) manejarEventoPad(e, false); });
        window.addEventListener('pointerup', () => { draggingPad = false; });

        async function centrarAreaSegura() {
            cursor.style.left = '50%';
            cursor.style.top = '50%';
            document.getElementById('ctrlXY').innerText = '50%, 50%';
            const res = await fetch('/api/esp32/center', { method: 'POST' });
            const d = await res.json();
            actualizarEstadoCtrl(d);
        }

        async function toggleLaser() {
            const res = await fetch('/api/esp32/laser', { method: 'POST' });
            const data = await res.json();
            const on = !!data.laser;
            document.getElementById('btnLaserToggle').classList.toggle('on', on);
            document.getElementById('btnLaserCtrl').classList.toggle('on', on);
            document.getElementById('btnLaserToggle').innerText = on ? 'Laser: ON' : 'Laser: OFF';
            document.getElementById('btnLaserCtrl').innerText = on ? 'Laser: ON' : 'Laser: OFF';
        }

        async function togglePatrulla() {
            const res = await fetch('/api/esp32/rect', { method: 'POST' });
            const d = await res.json();
            actualizarEstadoCtrl(d);
        }

        async function cargarEstadoESP32() {
            try {
                const res = await fetch('/api/esp32/status');
                const d = await res.json();
                actualizarEstadoCtrl(d);
            } catch (e) {}
        }

        function actualizarEstadoCtrl(d) {
            if (!d || d.error) return;
            if (d.cabeceo !== undefined) document.getElementById('ctrlC').innerText = d.cabeceo + '°';
            if (d.rotacion !== undefined) document.getElementById('ctrlR').innerText = d.rotacion + '°';
            if (d.cal) {
                document.getElementById('padTL').innerText = `TL ${d.cal.cTL}°/${d.cal.rTL}°`;
                document.getElementById('padTR').innerText = `TR ${d.cal.cTR}°/${d.cal.rTR}°`;
                document.getElementById('padBL').innerText = `BL ${d.cal.cBL}°/${d.cal.rBL}°`;
                document.getElementById('padBR').innerText = `BR ${d.cal.cBR}°/${d.cal.rBR}°`;
            }
            const btnP = document.getElementById('btnPatrulla');
            if (btnP && d.rect !== undefined) {
                btnP.innerText = d.rect ? 'Pausar Patrullaje' : 'Patrullar Perimetro';
            }
        }

        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
